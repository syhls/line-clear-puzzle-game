<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="8×6 推行消除小游戏原型" />
    <title>猫咪推行消除</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">8 × 6 PUZZLE</p>
          <h1>猫咪推行消除</h1>
        </div>
        <button id="restart-button" class="icon-button" type="button" aria-label="重新开始">
          ↻
        </button>
      </header>

      <section class="scorebar" aria-label="游戏数据">
        <div><span>分数</span><strong id="score">0</strong></div>
        <div><span>有效操作</span><strong id="moves">0</strong></div>
        <div><span>下一次消行</span><strong>+8</strong></div>
      </section>

      <section class="board-frame" aria-label="8列6行棋盘">
        <div id="board" class="board" role="application" aria-label="游戏棋盘">
          <div id="drag-guides" aria-hidden="true" hidden>
            <div id="column-guide" class="column-guide"></div>
            <div id="drop-guide" class="drop-guide"></div>
          </div>
        </div>
        <div id="game-over" class="game-over" hidden>
          <p>棋盘到顶了</p>
          <strong id="final-score">0 分</strong>
          <button id="again-button" type="button">再玩一局</button>
        </div>
      </section>

      <p id="status" class="status" aria-live="polite">
        按住任意方块，向左或向右拖动；松手后自动结算。
      </p>

      <details class="rules">
        <summary>玩法说明</summary>
        <p>按住方块左右拖动；拖回原位不会计入操作。松开有效移动的方块后，它会下落、满行消除并加 8 分，随后底部会推入一行不满的随机方块。</p>
      </details>
    </main>
    <script src="game.js"></script>
  </body>
</html>
