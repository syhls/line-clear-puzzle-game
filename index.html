<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="8×6 推行消除小游戏原型" />
    <title>猫咪推行消除</title>
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div class="title-group">
          <p class="eyebrow">8 × 6 PUZZLE</p>
          <h1>猫咪推行消除</h1>
        </div>
        <div class="header-metrics" aria-label="游戏数据">
          <span>分数 <strong id="score">0</strong></span>
          <span>操作 <strong id="moves">0</strong></span>
        </div>
        <button id="restart-button" class="icon-button" type="button" aria-label="重新开始">
          ↻
        </button>
      </header>

      <section class="board-frame" aria-label="8列6行棋盘">
        <div id="board" class="board" role="application" aria-label="游戏棋盘">
          <div id="drag-guides" aria-hidden="true" hidden>
            <div id="origin-guide" class="origin-guide"></div>
            <div id="drop-guide" class="drop-guide"></div>
          </div>
        </div>
        <div id="game-over" class="game-over" hidden>
          <p>棋盘到顶了</p>
          <strong id="final-score">0 分</strong>
          <button id="again-button" type="button">再玩一局</button>
        </div>
      </section>

      <p id="status" class="status" aria-live="polite">
        按住任意方块，向左或向右拖动；松手后自动结算。
      </p>
    </main>
    <aside class="rotate-notice" aria-live="polite">
      <span aria-hidden="true">↻</span>
      <strong>请横向握住手机</strong>
      <p>横屏后即可开始推行消除。</p>
    </aside>
    <script src="game.js?v=4"></script>
  </body>
</html>
